- name: Configure web servers
  hosts: webservers
  become: true
  tasks:
    - name: Ensure nginx is installed
      yum:
        name: nginx
        state: present

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: true
      ignore_errors: true  

    - name: Deploy homepage
      copy:
        content: "<h1>Deployed via GitHub Actions on {{ ansible_date_time.iso8601 }}</h1>"
        dest: /usr/share/nginx/html/index.html

