name: Ansible Deploy to Amazon Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, amazon-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm Ansible is available
        run: ansible --version

      - name: Lint the playbook
        run: |
          python3 -m pip install --user ansible-lint
          ~/.local/bin/ansible-lint playbooks/site.yml

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i inventory/production.ini playbooks/site.yml \
            --private-key ~/.ssh/deploy_key

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
